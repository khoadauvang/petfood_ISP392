spring.application.name=petfood-be

# ===== Kết nối SQL Server =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FoodPetShop;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.config.import=optional:file:.env[.properties]
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== JSP =====
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===== Upload ảnh sản phẩm (Staff/Admin) =====
# Mỗi ảnh tối đa 5MB, một lần lưu sản phẩm (5 ảnh + thông tin) tối đa 30MB. Mặc định Spring chỉ cho 1MB/file.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
# Request quá cỡ: Tomcat vẫn đọc hết (tới 100MB) để trả về trang báo lỗi, không ngắt kết nối giữa chừng
server.tomcat.max-swallow-size=100MB
# Form sản phẩm có khoảng 19 phần (các ô + 5 ảnh), dưới giới hạn mặc định 50 phần của Tomcat.
# Tên file ảnh dài / có dấu tiếng Việt làm header của mỗi phần vượt mức mặc định 512 byte, nên nới lên 2KB.
server.tomcat.max-part-header-size=2KB
# Thư mục lưu ảnh nhân viên tải lên, tính từ thư mục chạy app (thư mục gốc project). Đã thêm vào .gitignore
petfood.upload-dir=uploads

# ===== Mốc hạn dùng của kho (Admin cấu hình) =====
# Lô còn >= 90 ngày mới bán thường; dưới 90 ngày là cảnh báo đỏ, chỉ bán qua Flash Sale (BR-12, BR-54, BR-59)
petfood.shelf-life-commitment-days=90
# Lô còn dưới 21 ngày không được bán dưới mọi hình thức (BR-51, BR-63)
petfood.quarantine-days=21
