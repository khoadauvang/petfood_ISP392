spring.application.name=petfood-be

# ===== Kết nối SQL Server =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FoodPetShop;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.config.import=optional:file:.env[.properties]
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== Trang lỗi chung (ErrorPageAdvice, AppErrorViewResolver) =====
# Không đưa stack trace / thông điệp exception vào phản hồi lỗi (devtools bật chúng khi chạy dev)
server.error.include-stacktrace=never
server.error.include-message=never

# ===== JSP =====
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===== Upload ảnh sản phẩm (Staff/Admin) =====
# Mỗi ảnh tối đa 5MB, một lần lưu sản phẩm (5 ảnh + thông tin) tối đa 30MB. Mặc định Spring chỉ cho 1MB/file.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
# Request quá cỡ: Tomcat vẫn đọc hết (tới 100MB) để trả về trang báo lỗi, không ngắt kết nối giữa chừng
server.tomcat.max-swallow-size=100MB
# Form sản phẩm có khoảng 19 phần (các ô + 5 ảnh), dưới giới hạn mặc định 50 phần của Tomcat.
# Tên file ảnh dài / có dấu tiếng Việt làm header của mỗi phần vượt mức mặc định 512 byte, nên nới lên 2KB.
server.tomcat.max-part-header-size=2KB
# Thư mục lưu ảnh nhân viên tải lên, tính từ thư mục chạy app (thư mục gốc project). Đã thêm vào .gitignore
petfood.upload-dir=uploads

# Ảnh đại diện khách hàng nằm ở <petfood.upload-dir>/avatars, URL /images/avatars/**

# ===== Đăng nhập Google (tùy chọn, BR-05: chỉ dành cho khách hàng) =====
# Không ghi client-id/secret ở đây. Ai muốn bật thì thêm 2 dòng sau vào file .env (đã gitignore):
#   spring.security.oauth2.client.registration.google.client-id=...
#   spring.security.oauth2.client.registration.google.client-secret=...
# Redirect URI khai báo trên Google Cloud Console: http://localhost:8080/login/oauth2/code/google
# Chạy qua ngrok: khai báo thêm https://<domain-ngrok>/login/oauth2/code/google (mỗi domain một dòng).
# Spring dựng redirect URI theo domain + https của request ngrok chuyển tới (X-Forwarded-Host / X-Forwarded-Proto);
# không bật dòng dưới thì Spring thấy http và gửi Google sai URI -> lỗi 400 redirect_uri_mismatch.
server.forward-headers-strategy=framework
# Thiếu 2 dòng trên thì app vẫn chạy bình thường, trang đăng nhập chỉ ẩn nút "Đăng nhập bằng Google".

# ===== Phí giao hàng (chốt 15/10) =====
# Địa chỉ giao cách gốc toạ độ <= 5km (đường chim bay) VÀ tiền hàng sau giảm giá hạng >= 150.000đ -> miễn phí;
# còn lại 30.000đ. Gốc toạ độ: Đại học FPT TP.HCM, Khu Công nghệ cao (Q.9 cũ, TP Thủ Đức).
petfood.shipping.flat-fee=30000
petfood.shipping.free-min-subtotal=150000
petfood.shipping.free-radius-km=5
petfood.shipping.origin-lat=10.8411
petfood.shipping.origin-lng=106.8099
# Đổi địa chỉ khách gõ thành toạ độ bằng Geoapify (miễn phí 3.000 request/ngày, không cần thẻ).
# Đăng ký key tại https://myprojects.geoapify.com rồi thêm vào .env (không ghi ở đây):
#   petfood.geocoding.geoapify-api-key=...
# Thiếu key hoặc Geoapify không tìm ra địa chỉ: đơn vẫn đặt được, tính phí 30.000đ.

# ===== Giao hàng qua GHN (chốt 30/10, môi trường dev https://dev-online-gateway.ghn.vn) =====
# Đăng ký tài khoản dev tại https://5sao.ghn.dev, tạo cửa hàng (địa chỉ lấy hàng), rồi thêm vào .env (không ghi ở đây):
#   petfood.ghn.token=...
#   petfood.ghn.shop-id=...
# Thiếu 2 dòng trên thì giao hàng mô phỏng như cũ: địa chỉ gõ tay, staff chuyển trạng thái giao/hoàn tất bằng tay.
# Có cấu hình: trang đặt hàng chọn tỉnh/thành, phường/xã theo danh mục GHN; staff bấm "Tạo vận đơn GHN" khi giao.
# Phí ship khách trả vẫn theo quy tắc ở trên (ShippingFeeService), phí GHN do shop trả.
# Webhook trạng thái vận đơn: khai báo https://<domain-ngrok>/ghn/webhook ở trang Webhook của tài khoản GHN.
# Nếu đặt secret thì thêm header X-Webhook-Secret cùng giá trị trong cấu hình webhook bên GHN:
#   petfood.ghn.webhook-secret=...
petfood.ghn.base-url=https://dev-online-gateway.ghn.vn/shiip/public-api
# Mã đơn gửi GHN = <prefix>-<order_id>-<thời điểm đặt>. Cả nhóm dùng chung một shop GHN thì mỗi người đặt prefix
# khác nhau trong .env (ví dụ PFKHOA) để đơn ở các máy không trùng mã.
petfood.ghn.order-code-prefix=PF
# Địa chỉ lấy hàng (cũng là địa chỉ nhận hàng hoàn), mô hình 2 cấp: tên phường/tỉnh phải đúng danh mục GHN.
# Hồ sơ shop GHN dev để trống địa chỉ thì bắt buộc có các dòng này, nếu không GHN báo
# "Chuyển đổi địa chỉ gửi không thành công". SĐT người gửi để trống thì GHN dùng SĐT của shop
# (muốn ghi rõ thì thêm petfood.ghn.from-phone=... vào .env).
# Spring đọc file này bằng ISO-8859-1 nên chữ có dấu viết dạng \uXXXX:
# Lô E2a-7, Đường D1, Khu Công nghệ cao, Phường Tăng Nhơn Phú, Hồ Chí Minh
petfood.ghn.from-name=Food Pet Shop
petfood.ghn.from-address=L\u00f4 E2a-7, \u0110\u01b0\u1eddng D1, Khu C\u00f4ng ngh\u1ec7 cao, Ph\u01b0\u1eddng T\u0103ng Nh\u01a1n Ph\u00fa, H\u1ed3 Ch\u00ed Minh
petfood.ghn.from-ward-name=Ph\u01b0\u1eddng T\u0103ng Nh\u01a1n Ph\u00fa
petfood.ghn.from-province-name=H\u1ed3 Ch\u00ed Minh
# Khối lượng 1 sản phẩm khi quy cách không đọc được (quy cách dạng 2000G / 1.5KG thì lấy theo quy cách)
petfood.ghn.default-item-weight-grams=1000
petfood.ghn.box-length-cm=30
petfood.ghn.box-width-cm=20
petfood.ghn.box-height-cm=15
# Khách được xem hàng nhưng không thử (CHOXEMHANGKHONGTHU), cấm xem (KHONGCHOXEMHANG) hoặc cho thử (CHOTHUHANG)
petfood.ghn.required-note=CHOXEMHANGKHONGTHU

# ===== Thanh toán (module 5) =====
# VNPay Sandbox. Mã TMN và secret để trong .env (không ghi ở đây):
#   petfood.vnpay.tmn-code=...
#   petfood.vnpay.hash-secret=...
# Thiếu 2 dòng trên thì chỉ thanh toán COD, ô VNPay ở trang đặt hàng bị tắt.
petfood.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
petfood.vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
petfood.vnpay.return-url=http://localhost:8080/payment/vnpay-return
# Chạy qua ngrok: ghi đè trong .env bằng domain ngrok để khách mở trên điện thoại vẫn quay về được:
#   petfood.vnpay.return-url=https://<domain-ngrok>/payment/vnpay-return
# IPN URL (https://<domain-ngrok>/payment/vnpay-ipn) không gửi kèm link thanh toán mà khai báo ở trang merchant VNPay.
# Giữ hàng chờ khách trả tiền VNPay (BR-23); quá hạn thì job hỏi VNPay (querydr) rồi xác nhận hoặc huỷ đơn
petfood.vnpay.hold-minutes=15
# Đơn COD chưa được xác nhận sau số giờ này thì tự huỷ (BR-27)
petfood.order.cod-confirm-hours=24

# ===== Email trả lời yêu cầu hỗ trợ (module 9, Gmail SMTP) =====
# Tài khoản Gmail và mật khẩu ứng dụng (App Password, cần bật xác minh 2 bước) để trong .env (không ghi ở đây):
#   spring.mail.username=...@gmail.com
#   spring.mail.password=...
# Thiếu 2 dòng trên thì yêu cầu vẫn trả lời được nhưng email lưu "Gửi lỗi", cấu hình xong bấm "Gửi lại".
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===== Quên mật khẩu bằng OTP (mục 9.11, gửi qua cùng Gmail SMTP ở trên) =====
# Mã 6 số có hiệu lực 10 phút, sai 5 lần thì huỷ; gửi lại sau 60 giây, tối đa 5 mã/giờ cho một tài khoản
petfood.password-reset.otp-minutes=10
petfood.password-reset.max-attempts=5
petfood.password-reset.resend-seconds=60
petfood.password-reset.max-per-hour=5

# ===== Hạng thành viên (requirements 7.6, BR-40, BR-41) =====
# Chi tiêu tích luỹ = tiền hàng (total_amount - shipping_fee) các đơn COMPLETED đã qua hạn trả hàng,
# trừ tiền đã hoàn của yêu cầu trả hàng REFUNDED. Mức giảm tính theo phần trăm, chỉ áp cho hàng giá thường (BR-43).
petfood.membership.return-window-days=3
petfood.membership.silver-min-spend=1200000
petfood.membership.gold-min-spend=4000000
petfood.membership.diamond-min-spend=10000000
petfood.membership.bronze-rate=0.10
petfood.membership.silver-rate=3
petfood.membership.gold-rate=5
petfood.membership.diamond-rate=10
# Tính lại hạng mỗi ngày lúc 00:05 (Admin bấm "Tính lại hạng" ở trang Đơn hàng để chạy ngay)
petfood.membership.recalc-cron=0 5 0 * * *

# ===== Mốc hạn dùng của kho (Admin cấu hình) =====
# Lô còn >= 90 ngày mới bán thường; dưới 90 ngày là cảnh báo đỏ, chỉ bán qua Flash Sale (BR-12, BR-54, BR-59)
petfood.shelf-life-commitment-days=90
# Lô còn dưới 21 ngày không được bán dưới mọi hình thức (BR-51, BR-63)
petfood.quarantine-days=21
# Giá Flash Sale tự tính từ giá thường theo HSD của lô (chốt 22/10):
#   còn 30 đến dưới 90 ngày -> giảm 40%; còn dưới 30 ngày (tối thiểu 21 ngày) -> giảm 70%
petfood.flash-sale.deep-discount-days=30
petfood.flash-sale.discount-percent=40
petfood.flash-sale.deep-discount-percent=70

# ===== Chatbox tư vấn AI (Google Gemini, chốt 30/10) =====
# Key lấy ở https://aistudio.google.com/api-keys, đặt trong .env (không ghi ở đây):
#   petfood.gemini.api-key=...
# Thiếu key thì chatbox trả lời theo từ khoá như cũ.
# Model nhanh (~2 giây/câu) hợp với chat. gemini-3.8-flash thông minh hơn nhưng mất ~20 giây/câu.
petfood.gemini.model=gemini-flash-lite-latest
# Để trống = không gửi thinkingConfig (model tự quyết). Ví dụ: low, high (tuỳ model hỗ trợ)
petfood.gemini.thinking-level=
petfood.gemini.temperature=0.6
petfood.gemini.max-output-tokens=2048
