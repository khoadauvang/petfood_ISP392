spring.application.name=petfood-be

# ===== Kết nối SQL Server =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FoodPetShop;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.config.import=optional:file:.env[.properties]
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== Trang lỗi chung (ErrorPageAdvice, AppErrorViewResolver) =====
# Không đưa stack trace / thông điệp exception vào phản hồi lỗi (devtools bật chúng khi chạy dev)
server.error.include-stacktrace=never
server.error.include-message=never

# ===== JSP =====
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===== Upload ảnh sản phẩm (Staff/Admin) =====
# Mỗi ảnh tối đa 5MB, một lần lưu sản phẩm (5 ảnh + thông tin) tối đa 30MB. Mặc định Spring chỉ cho 1MB/file.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
# Request quá cỡ: Tomcat vẫn đọc hết (tới 100MB) để trả về trang báo lỗi, không ngắt kết nối giữa chừng
server.tomcat.max-swallow-size=100MB
# Form sản phẩm có khoảng 19 phần (các ô + 5 ảnh), dưới giới hạn mặc định 50 phần của Tomcat.
# Tên file ảnh dài / có dấu tiếng Việt làm header của mỗi phần vượt mức mặc định 512 byte, nên nới lên 2KB.
server.tomcat.max-part-header-size=2KB
# Thư mục lưu ảnh nhân viên tải lên, tính từ thư mục chạy app (thư mục gốc project). Đã thêm vào .gitignore
petfood.upload-dir=uploads

# Ảnh đại diện khách hàng nằm ở <petfood.upload-dir>/avatars, URL /images/avatars/**

# ===== Đăng nhập Google (tùy chọn, BR-05: chỉ dành cho khách hàng) =====
# Không ghi client-id/secret ở đây. Ai muốn bật thì thêm 2 dòng sau vào file .env (đã gitignore):
#   spring.security.oauth2.client.registration.google.client-id=...
#   spring.security.oauth2.client.registration.google.client-secret=...
# Redirect URI khai báo trên Google Cloud Console: http://localhost:8080/login/oauth2/code/google
# Thiếu 2 dòng trên thì app vẫn chạy bình thường, trang đăng nhập chỉ ẩn nút "Đăng nhập bằng Google".

# ===== Phí giao hàng (chốt 15/10) =====
# Địa chỉ giao cách gốc toạ độ <= 5km (đường chim bay) VÀ tiền hàng sau giảm giá hạng >= 150.000đ -> miễn phí;
# còn lại 30.000đ. Gốc toạ độ: Đại học FPT TP.HCM, Khu Công nghệ cao (Q.9 cũ, TP Thủ Đức).
petfood.shipping.flat-fee=30000
petfood.shipping.free-min-subtotal=150000
petfood.shipping.free-radius-km=5
petfood.shipping.origin-lat=10.8411
petfood.shipping.origin-lng=106.8099
# Đổi địa chỉ khách gõ thành toạ độ bằng Geoapify (miễn phí 3.000 request/ngày, không cần thẻ).
# Đăng ký key tại https://myprojects.geoapify.com rồi thêm vào .env (không ghi ở đây):
#   petfood.geocoding.geoapify-api-key=...
# Thiếu key hoặc Geoapify không tìm ra địa chỉ: đơn vẫn đặt được, tính phí 30.000đ.

# ===== Thanh toán (module 5) =====
# VNPay Sandbox. Mã TMN và secret để trong .env (không ghi ở đây):
#   petfood.vnpay.tmn-code=...
#   petfood.vnpay.hash-secret=...
# Thiếu 2 dòng trên thì chỉ thanh toán COD, ô VNPay ở trang đặt hàng bị tắt.
petfood.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
petfood.vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
petfood.vnpay.return-url=http://localhost:8080/payment/vnpay-return
# Giữ hàng chờ khách trả tiền VNPay (BR-23); quá hạn thì job hỏi VNPay (querydr) rồi xác nhận hoặc huỷ đơn
petfood.vnpay.hold-minutes=15
# Đơn COD chưa được xác nhận sau số giờ này thì tự huỷ (BR-27)
petfood.order.cod-confirm-hours=24

# ===== Email trả lời yêu cầu hỗ trợ (module 9, Gmail SMTP) =====
# Tài khoản Gmail và mật khẩu ứng dụng (App Password, cần bật xác minh 2 bước) để trong .env (không ghi ở đây):
#   spring.mail.username=...@gmail.com
#   spring.mail.password=...
# Thiếu 2 dòng trên thì yêu cầu vẫn trả lời được nhưng email lưu "Gửi lỗi", cấu hình xong bấm "Gửi lại".
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===== Quên mật khẩu bằng OTP (mục 9.11, gửi qua cùng Gmail SMTP ở trên) =====
# Mã 6 số có hiệu lực 10 phút, sai 5 lần thì huỷ; gửi lại sau 60 giây, tối đa 5 mã/giờ cho một tài khoản
petfood.password-reset.otp-minutes=10
petfood.password-reset.max-attempts=5
petfood.password-reset.resend-seconds=60
petfood.password-reset.max-per-hour=5

# ===== Hạng thành viên (requirements 7.6, BR-40, BR-41) =====
# Chi tiêu tích luỹ = tiền hàng (total_amount - shipping_fee) các đơn COMPLETED đã qua hạn trả hàng,
# trừ tiền đã hoàn của yêu cầu trả hàng REFUNDED. Mức giảm tính theo phần trăm, chỉ áp cho hàng giá thường (BR-43).
petfood.membership.return-window-days=3
petfood.membership.silver-min-spend=1200000
petfood.membership.gold-min-spend=4000000
petfood.membership.diamond-min-spend=10000000
petfood.membership.bronze-rate=0.10
petfood.membership.silver-rate=3
petfood.membership.gold-rate=5
petfood.membership.diamond-rate=10
# Tính lại hạng mỗi ngày lúc 00:05 (Admin bấm "Tính lại hạng" ở trang Đơn hàng để chạy ngay)
petfood.membership.recalc-cron=0 5 0 * * *

# ===== Mốc hạn dùng của kho (Admin cấu hình) =====
# Lô còn >= 90 ngày mới bán thường; dưới 90 ngày là cảnh báo đỏ, chỉ bán qua Flash Sale (BR-12, BR-54, BR-59)
petfood.shelf-life-commitment-days=90
# Lô còn dưới 21 ngày không được bán dưới mọi hình thức (BR-51, BR-63)
petfood.quarantine-days=21
